# ---------------------------------------------------------------------------
# Where jobs come from. Only sources that allow automated access are used.
# LinkedIn and Naukri forbid scraping, so they are NOT used. Set up their own
# free email alerts as a complement (see README).
# Each run prints which sources worked; a source that breaks is skipped.
# ---------------------------------------------------------------------------
sources:
  remotive:        # remote job board. Max 4 calls/day allowed, so keep <= 4 queries
    enabled: true
    queries: [retail media, campaign manager, account manager, communications]
  remoteok:
    enabled: true
  weworkremotely:
    enabled: true
  himalayas:
    enabled: true
    pages: 5
  jobicy:
    enabled: true
    geos: [india, apac, anywhere]
  adzuna:          # switched off: its free plan is too small
    enabled: false
    queries: [retail media, campaign manager, account manager ecommerce, public relations]
    max_days_old: 30
  serpapi:         # Google Jobs (includes LinkedIn / Naukri / Indeed postings). Free key SERPAPI_KEY, skipped without it
    enabled: true
    queries: [retail media remote India, campaign manager ecommerce remote India, account manager ecommerce remote India, public relations communications remote India, ecommerce campaign manager hybrid Bengaluru, communications account manager hybrid Mumbai]
    max_searches: 4        # free plan has a small monthly allowance, so only the first N queries run each day
  jooble:          # free key JOOBLE_KEY (request at jooble.org/api/about), skipped without it
    enabled: true
    queries: [retail media remote, campaign manager remote, account manager ecommerce remote, communications remote, campaign manager hybrid Bengaluru, account manager hybrid Mumbai]

  email_alerts:    # reads the platforms' own alert emails from a dedicated Gmail (secrets ALERT_INBOX_USER / ALERT_INBOX_PASS)
    enabled: true
    lookback_days: 7       # looks back a week so a missed run or a weekly email is never lost. Repeats are removed automatically
    senders: [linkedin.com, naukri.com, indeed.com]

  # ----- Company career pages --------------------------------------------
  # Add a company by its name in the career-page web address:
  #   boards.greenhouse.io/<name>   jobs.lever.co/<name>   jobs.ashbyhq.com/<name>   apply.workable.com/<name>
  # The lists below were set up for you. meesho (Lever) and lenskart (Workable) were confirmed working earlier; the others are
  # NOT confirmed. The first run's log says 'board not found' for any wrong name, and those can simply be removed.
  greenhouse:
    enabled: true
    companies: []
  lever:
    enabled: true
    companies: [meesho, jobgether]
  ashby:
    enabled: true
    companies: []
  workable:
    enabled: true
    companies: [lenskart]
  # SmartRecruiters. Name is case sensitive (taken from its jobs address).
  smartrecruiters:
    enabled: true
    companies: []
    max_details_per_company: 40
  # Workday is used by many big retailers and FMCG companies. These entries are NOT yet confirmed:
  # the first run's log says "board not found" for any that are wrong. Each needs host, tenant and site, which
  # appear in the company's jobs address: https://<host>/<site>  (tenant is the first part of <host>).
  workday:
    enabled: true
    queries: [retail media, campaign, account manager, communications, ecommerce, marketplace]
    pages: 2
    max_details_per_company: 25
    companies:
      - {name: Target, host: target.wd5.myworkdayjobs.com, tenant: target, site: targetcareers}
      - {name: Nike, host: nike.wd1.myworkdayjobs.com, tenant: nike, site: nke}
      - {name: Unilever, host: unilever.wd3.myworkdayjobs.com, tenant: unilever, site: Unilever_Experienced_Professionals}
      - {name: "Procter & Gamble", host: pg.wd5.myworkdayjobs.com, tenant: pg, site: 1000}
      - {name: "Lowe's", host: lowes.wd5.myworkdayjobs.com, tenant: lowes, site: LWS_External_CS}
      - {name: Kimberly-Clark, host: kimberlyclark.wd1.myworkdayjobs.com, tenant: kimberlyclark, site: GLOBAL}
